name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build debug app
        run: |
          xcodebuild \
            -project SqueekyCleanMac.xcodeproj \
            -scheme SqueekyCleanMac \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

  release:
    name: Build and publish release
    runs-on: macos-26
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package release zip
        id: package
        run: |
          zip_path="$(Scripts/package_release.sh)"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="main-${GITHUB_RUN_NUMBER}-${short_sha}"

          gh release create "$tag" "$ZIP_PATH" \
            --target "$GITHUB_SHA" \
            --title "Squeeky Clean Mac ${short_sha}" \
            --notes "Automated build from main commit ${GITHUB_SHA}."
