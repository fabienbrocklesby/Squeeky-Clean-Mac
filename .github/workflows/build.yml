name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build debug app
        run: |
          xcodebuild \
            -project SqueekyCleanMac.xcodeproj \
            -scheme SqueekyCleanMac \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build
